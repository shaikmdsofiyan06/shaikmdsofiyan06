name: Nebula Metrics Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shaikmdsofiyan06
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_threshold: 0%

          plugin_lines: yes
          plugin_habits: yes
          plugin_achievements: yes
          plugin_streak: yes

          output_action: mkdir -p assets/metrics && mv output.svg assets/metrics/dashboard.svg

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/metrics/dashboard.svg
          git diff --staged --quiet || git commit -m "chore: refresh Nebula metrics dashboard [skip ci]"
          git pull --rebase
          git push
