<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="spotPurple" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotCyan" cx="85%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotGreen" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 46" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgBase)"/>
  <rect width="1200" height="800" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="800" fill="url(#spotPurple)"/>
  <rect width="1200" height="800" fill="url(#spotCyan)"/>
  <rect width="1200" height="800" fill="url(#spotGreen)"/>

  <g fill="#22C55E" opacity="0.35">
    <circle cx="140" cy="120" r="2"/>
    <circle cx="980" cy="90" r="2.2"/>
    <circle cx="620" cy="60" r="1.6"/>
    <circle cx="1080" cy="400" r="2"/>
    <circle cx="80" cy="520" r="1.8"/>
    <circle cx="500" cy="700" r="2.2"/>
    <circle cx="900" cy="650" r="1.8"/>
  </g>
</svg>
