<svg width="1000" height="160" viewBox="0 0 1000 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="footText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .rise { animation: rise 4s ease-in-out infinite; }
      @keyframes rise {
        0%,100% { transform: translateY(0); opacity: 0.5; }
        50% { transform: translateY(-8px); opacity: 1; }
      }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse {
        0%,100% { r: 2; opacity: 0.4; }
        50% { r: 3.4; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1000" height="160" fill="url(#footBg)"/>
  <path d="M0,0 C150,20 300,-10 450,8 C600,24 750,-4 1000,14 L1000,0 L0,0 Z" fill="#111a2e" opacity="0.6"/>

  <g fill="#22D3EE">
    <circle class="pulse" cx="120" cy="40" r="2"/>
    <circle class="pulse" cx="860" cy="35" r="2"/>
    <circle class="pulse" cx="500" cy="20" r="2"/>
    <circle class="pulse" cx="700" cy="55" r="2"/>
    <circle class="pulse" cx="300" cy="50" r="2"/>
  </g>

  <text x="500" y="78" text-anchor="middle" font-size="22" font-weight="700"
        font-family="'Segoe UI', sans-serif" fill="url(#footText)" class="rise">
    Thanks for visiting my profile ✦
  </text>

  <text x="500" y="108" text-anchor="middle" font-size="14" font-family="Consolas, monospace" fill="#94A3B8">
    Designed with the Aurora Developer theme — Nebula Developer Profile
  </text>

  <line x1="300" y1="126" x2="700" y2="126" stroke="#233047" stroke-width="1"/>

  <text x="500" y="146" text-anchor="middle" font-size="12" fill="#64748B" font-family="Consolas, monospace">
    © 2026 Shaik MD Sofiyan · Crafted with code, coffee & curiosity
  </text>
</svg>
