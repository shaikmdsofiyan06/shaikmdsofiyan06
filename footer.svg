<svg width="1000" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="footText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22C55E"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .rise { animation: rise 4s ease-in-out infinite; }
      @keyframes rise {
        0%,100% { transform: translateY(0); opacity: 0.55; }
        50% { transform: translateY(-7px); opacity: 1; }
      }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse {
        0%,100% { r: 2; opacity: 0.4; }
        50% { r: 3.2; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1000" height="150" fill="url(#footBg)"/>
  <path d="M0,0 C150,18 300,-8 450,6 C600,20 750,-4 1000,12 L1000,0 L0,0 Z" fill="#161B22" opacity="0.6"/>

  <g fill="#06B6D4">
    <circle class="pulse" cx="130" cy="38" r="2"/>
    <circle class="pulse" cx="850" cy="34" r="2"/>
    <circle class="pulse" cx="500" cy="20" r="2"/>
    <circle class="pulse" cx="690" cy="52" r="2"/>
    <circle class="pulse" cx="310" cy="48" r="2"/>
  </g>

  <text x="500" y="76" text-anchor="middle" font-size="21" font-weight="700"
        font-family="'Segoe UI', sans-serif" fill="url(#footText)" class="rise">
    Thanks for stopping by
  </text>

  <text x="500" y="104" text-anchor="middle" font-size="13.5" font-family="Consolas, monospace" fill="#94A3B8">
    Built by Shaik MD Sofiyan — Full Stack Developer, always learning
  </text>

  <line x1="320" y1="120" x2="680" y2="120" stroke="#233047" stroke-width="1"/>

  <text x="500" y="138" text-anchor="middle" font-size="11.5" fill="#64748B" font-family="Consolas, monospace">
    © 2026 · If you found something useful here, a star is always appreciated
  </text>
</svg>
