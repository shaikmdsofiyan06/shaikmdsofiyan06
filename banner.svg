<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="45%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <style>
      .particle { animation: drift 10s ease-in-out infinite; }
      .particle2 { animation: drift2 14s ease-in-out infinite; }
      @keyframes drift {
        0%   { transform: translate(0,0); opacity: 0.15; }
        50%  { transform: translate(18px,-22px); opacity: 0.6; }
        100% { transform: translate(0,0); opacity: 0.15; }
      }
      @keyframes drift2 {
        0%   { transform: translate(0,0); opacity: 0.1; }
        50%  { transform: translate(-24px,16px); opacity: 0.5; }
        100% { transform: translate(0,0); opacity: 0.1; }
      }
      .wave { animation: waveMove 6s ease-in-out infinite; }
      @keyframes waveMove {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .type-text {
        font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
        font-weight: 700;
        fill: url(#textGrad);
      }
    </style>
  </defs>

  <rect width="1000" height="280" fill="url(#bgGrad)"/>
  <circle cx="820" cy="70" r="140" fill="url(#glow)"/>
  <circle cx="120" cy="220" r="120" fill="url(#glow)"/>

  <!-- Scattered particles -->
  <g fill="#22D3EE">
    <circle class="particle" cx="80" cy="60" r="2.5"/>
    <circle class="particle2" cx="180" cy="40" r="2"/>
    <circle class="particle" cx="260" cy="90" r="1.8"/>
    <circle class="particle2" cx="720" cy="50" r="2.2"/>
    <circle class="particle" cx="880" cy="120" r="2"/>
    <circle class="particle2" cx="950" cy="60" r="1.6"/>
    <circle class="particle" cx="60" cy="200" r="2"/>
    <circle class="particle2" cx="930" cy="220" r="2.4"/>
  </g>

  <!-- Geometric accent shapes -->
  <g opacity="0.5">
    <polygon points="900,20 940,20 960,55 940,90 900,90 880,55" fill="none" stroke="#8B5CF6" stroke-width="1.5" class="wave"/>
    <rect x="30" y="30" width="26" height="26" rx="6" fill="none" stroke="#3B82F6" stroke-width="1.5" transform="rotate(20 43 43)" class="wave"/>
  </g>

  <!-- Name with typing animation -->
  <text x="60" y="130" font-size="46" class="type-text">
    <tspan>Shaik MD Sofiyan</tspan>
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Typing caret + subtitle typed line -->
  <text x="62" y="168" font-size="19" fill="#F8FAFC" font-family="Consolas, monospace" opacity="0.92">
    <tspan>&gt; AI-Assisted Full-Stack Developer</tspan>
  </text>
  <rect x="430" y="152" width="10" height="20" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="62" y="200" font-size="14.5" fill="#94A3B8" font-family="Consolas, monospace">
    Python • Flask • JavaScript • HTML • CSS • SQLite
  </text>

  <!-- Bottom animated wave -->
  <path class="wave" d="M0,260 C150,240 300,275 450,258 C600,242 750,272 1000,255 L1000,280 L0,280 Z" fill="#111a2e"/>
  <path d="M0,268 C150,250 300,282 450,266 C600,250 750,280 1000,264 L1000,280 L0,280 Z" fill="#0D1117"/>
</svg>
