name: Nebula Profile Automation

on:
  schedule:
    # Runs daily at 00:00 UTC — refreshes stats + snake automatically
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------
  # JOB 1 — Metrics dashboard + isometric contribution calendar
  # ----------------------------------------------------------------
  build-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate main metrics panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shaikmdsofiyan06
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_threshold: 0%

          plugin_lines: yes
          plugin_lines_history_limit: 15

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

          plugin_streak: yes

          output_action: mkdir -p assets/metrics && mv output.svg assets/metrics/dashboard.svg

      - name: Generate isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shaikmdsofiyan06
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: mkdir -p assets/metrics && mv output.svg assets/metrics/isocalendar.svg

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/metrics/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh Nebula metrics dashboard [skip ci]"
          git pull --rebase
          git push

  # ----------------------------------------------------------------
  # JOB 2 — Animated contribution snake
  # ----------------------------------------------------------------
  build-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation assets
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: shaikmdsofiyan06
          outputs: |
            assets/snake/aurora-snake-dark.svg?palette=github-dark
            assets/snake/aurora-snake-light.svg?palette=github-light
            assets/snake/aurora-snake.gif?color_snake=%2306B6D4&color_dots=%233B82F6,%2306B6D4,%238B5CF6,%2322D3EE

      - name: Push generated snake assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: assets/snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
