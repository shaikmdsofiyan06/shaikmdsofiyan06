name: Nebula Profile Automation

on:
  schedule:
    # Runs daily at 00:00 UTC — refreshes stats, snake, and profile data
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------
  # JOB 1 — Metrics dashboard (stats, languages, habits, achievements)
  # ----------------------------------------------------------------
  build-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shaikmdsofiyan06
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_threshold: 0%

          plugin_lines: yes
          plugin_habits: yes
          plugin_achievements: yes
          plugin_streak: yes

          output_action: mkdir -p assets/metrics && mv output.svg assets/metrics/dashboard.svg

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/metrics/dashboard.svg
          git diff --staged --quiet || git commit -m "chore: refresh metrics dashboard [skip ci]"
          git pull --rebase
          git push

  # ----------------------------------------------------------------
  # JOB 2 — Animated contribution snake
  # ----------------------------------------------------------------
  build-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: shaikmdsofiyan06
          outputs: |
            assets/snake/contribution-snake.svg?palette=github-dark
            assets/snake/contribution-snake-light.svg?palette=github-light
            assets/snake/contribution-snake.gif?color_snake=%2306B6D4&color_dots=%237C3AED,%2306B6D4,%2322C55E

      - name: Commit updated snake assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snake/*.svg assets/snake/*.gif
          git diff --staged --quiet || git commit -m "chore: refresh contribution snake [skip ci]"
          git pull --rebase
          git push

  # ----------------------------------------------------------------
  # JOB 3 — Sanity check: confirm README references resolve after the
  # above jobs run (keeps the "no broken links" requirement enforced)
  # ----------------------------------------------------------------
  verify-profile:
    needs: [build-metrics, build-snake]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm generated assets exist
        run: |
          test -f assets/metrics/dashboard.svg && echo "dashboard.svg OK"
          test -f assets/snake/contribution-snake.gif && echo "contribution-snake.gif OK"
