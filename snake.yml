name: Nebula Contribution Snake

on:
  schedule:
    # Rebuilds the snake animation every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation assets
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: shaikmdsofiyan06
          outputs: |
            assets/snake/aurora-snake-dark.svg?palette=github-dark
            assets/snake/aurora-snake-light.svg?palette=github-light
            assets/snake/aurora-snake.gif?color_snake=%2306B6D4&color_dots=%233B82F6,%2306B6D4,%238B5CF6,%2322D3EE

      - name: Push generated snake assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: assets/snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
