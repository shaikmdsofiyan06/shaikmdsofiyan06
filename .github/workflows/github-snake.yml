name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: shaikmdsofiyan06
          outputs: |
            dist/github-snake.svg?color_snake=%23ff4fd8&color_dots=%232a1240,%234a1f66,%237a2fb8,%23a259ff,%234fe0ff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ff4fd8&color_dots=%232a1240,%234a1f66,%237a2fb8,%23a259ff,%234fe0ff

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update snake animation [skip ci]"
